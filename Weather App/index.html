<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>Weather App 🌤️</h1>

    <div class="search">
      <input
        type="text"
        id="cityInput"
        placeholder="Enter city name (e.g., Hyderabad)"
      />
      <button id="searchBtn">Get Weather</button>
    </div>

    <div id="message" class="message"></div>

    <div id="weather" class="weather hidden">
      <h2 id="location"></h2>
      <p id="temp"></p>
      <p id="humidity"></p>
      <p id="condition"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
